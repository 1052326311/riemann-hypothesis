name: challenge files

# The Comparator challenge files say what the proof is judged against, so a pull request may not
# change them. `Challenge.lean` imports `src/Statements.lean`, which defines the propositions that
# four of the five theorems state, and `src/Main.lean` imports it as well. Comparator would accept
# a change there, since both sides would see it, so it is a challenge file too.
#
# This runs the base branch's copy of the workflow and nothing from the pull request: it fetches
# commits and trees, without file contents, and reads the file hashes with git. A pull request
# cannot switch it off, and it needs no approval to run on a pull request from a fork. (It does
# not ask GitHub's compare API for the merge base, which times out on a pull request that changes
# very many files.)

on:
  pull_request_target:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to check
        type: number
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  frozen:
    name: Comparator challenge files are unchanged
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare the files where the pull request branched off and at its head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          frozen="Challenge.lean comparator.json src/Statements.lean"

          base=$(gh api "repos/$REPO/pulls/$PR" --jq .base.sha)
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          git init -q pr
          git -C pr fetch -q --no-tags --filter=blob:none "https://github.com/$REPO" "$base" "$head"
          # A head that has merged two main commits, neither containing the other, has more than
          # one merge base, and GitHub's merge uses all of them.
          forks=$(git -C pr merge-base --all "$base" "$head")
          echo "pull request $PR: branched off at ${forks//$'\n'/ }, head $head"

          # A file's mode, type and blob hash at a commit; nothing if the file is not there. The
          # mode matters: a symlink whose target is the old contents has the old hash. If git
          # cannot read a tree on the way, it fails and so does the job.
          entry() {
            git -C pr ls-tree --format='%(objectmode) %(objecttype) %(objectname)' "$1" -- "$2"
          }

          status=0
          for path in $frozen; do
            new=$(entry "$head" "$path")
            ours=$(entry "$base" "$path")
            seen='' verdict="unchanged: $path"
            for fork in $forks; do
              old=$(entry "$fork" "$path")
              [ -n "$old" ] || continue
              seen=1
              if [ "$old" != "$new" ]; then
                verdict="::error file=$path::This pull request changes $path, a Comparator challenge file."
                status=1
              fi
            done
            # Where the pull request branched off without the file, a change to the path it was
            # moved from can land in it when the branch is merged, so that is not checked as an
            # added file unless the base branch does not have it either.
            if [ -z "$seen" ] && [ -n "$ours" ]; then
              verdict="::error file=$path::This pull request branched off before $path was there. Merge main into it so the file can be compared."
              status=1
            fi
            echo "$verdict"
          done
          if [ "$status" != 0 ]; then
            echo "These files say what the proof is judged against, and pull requests may not change them."
            echo "If one of them has to change, ask a maintainer in the pull request."
          fi
          exit "$status"
